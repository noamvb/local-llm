name: LocalLLM PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localllm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Repository safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for forbidden tracked files
        shell: bash
        run: |
          set -e
          forbidden=$(git ls-files | grep -E '^(local\.properties|keystore\.properties|\.env|.*\.jks|.*\.keystore)$' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: forbidden tracked files:"; echo "$forbidden"; exit 1
          fi
          if git grep -E -n -e '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----' -- . ':!docs/**' ':!*.md'; then
            echo "ERROR: private key material in tracked content"; exit 1
          fi
          # A model binary must never be committed; they are gigabytes and redownloadable.
          if git ls-files | grep -E '\.(litertlm|task|gguf|bin)$'; then
            echo "ERROR: a model binary is tracked"; exit 1
          fi
          echo "Scan passed clean."

  android:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localllm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localllm-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
